<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="Ilustração de um site profissional sendo desenvolvido em diferentes dispositivos">
  <!--
    PLACEHOLDER: substituir este arquivo por um mockup ou foto real dos projetos.
    Basta trocar o conteúdo deste SVG por uma imagem PNG/JPG em assets/
    e atualizar o atributo src no index.html (seção hero).
  -->
  <defs>
    <linearGradient id="fundoHero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DBEAFE"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <clipPath id="janelaHero">
      <rect x="36" y="56" width="460" height="340" rx="14"/>
    </clipPath>
  </defs>

  <rect width="640" height="480" fill="url(#fundoHero)"/>

  <!-- Janela do navegador -->
  <g>
    <rect x="36" y="56" width="460" height="340" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <g clip-path="url(#janelaHero)">
      <rect x="36" y="56" width="460" height="44" fill="#F1F5F9"/>
      <line x1="36" y1="100" x2="496" y2="100" stroke="#E2E8F0"/>
    </g>
    <circle cx="64" cy="78" r="5" fill="#CBD5E1"/>
    <circle cx="84" cy="78" r="5" fill="#CBD5E1"/>
    <circle cx="104" cy="78" r="5" fill="#CBD5E1"/>

    <!-- Estrutura de conteúdo -->
    <rect x="64" y="132" width="230" height="20" rx="4" fill="#0F172A"/>
    <rect x="64" y="168" width="280" height="10" rx="5" fill="#CBD5E1"/>
    <rect x="64" y="188" width="250" height="10" rx="5" fill="#CBD5E1"/>
    <rect x="64" y="208" width="200" height="10" rx="5" fill="#CBD5E1"/>
    <rect x="64" y="244" width="130" height="40" rx="8" fill="#2563EB"/>
    <rect x="210" y="244" width="110" height="40" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>

    <!-- Cartão lateral -->
    <rect x="356" y="132" width="112" height="104" rx="10" fill="#DBEAFE"/>
    <rect x="372" y="152" width="80" height="8" rx="4" fill="#93C5FD"/>
    <rect x="372" y="172" width="60" height="8" rx="4" fill="#93C5FD"/>
    <rect x="372" y="192" width="70" height="8" rx="4" fill="#93C5FD"/>

    <!-- Blocos inferiores -->
    <rect x="64" y="310" width="170" height="66" rx="8" fill="#F1F5F9"/>
    <rect x="80" y="330" width="90" height="8" rx="4" fill="#CBD5E1"/>
    <rect x="80" y="348" width="130" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="250" y="310" width="170" height="66" rx="8" fill="#F1F5F9"/>
    <rect x="266" y="330" width="90" height="8" rx="4" fill="#CBD5E1"/>
    <rect x="266" y="348" width="130" height="8" rx="4" fill="#E2E8F0"/>
  </g>

  <!-- Versão mobile -->
  <g>
    <rect x="470" y="176" width="132" height="252" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="486" y="196" width="100" height="70" rx="8" fill="#DBEAFE"/>
    <rect x="486" y="282" width="100" height="10" rx="5" fill="#CBD5E1"/>
    <rect x="486" y="302" width="80" height="10" rx="5" fill="#CBD5E1"/>
    <rect x="486" y="332" width="100" height="34" rx="8" fill="#2563EB"/>
    <rect x="516" y="408" width="40" height="6" rx="3" fill="#CBD5E1"/>
  </g>

  <!-- Selos flutuantes -->
  <g>
    <circle cx="480" cy="130" r="26" fill="#10B981"/>
    <polyline points="470,130 477,137 491,123" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
